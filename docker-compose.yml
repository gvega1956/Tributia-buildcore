version: '3.9'

services:
  postgres:
    image: postgres:16-alpine
    container_name: tributia_postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: tributia
      POSTGRES_PASSWORD: tributia_dev
      POSTGRES_DB: tributia_buildcore
    ports:
      - '5432:5432'
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./tools/db/init.sql:/docker-entrypoint-initdb.d/01-init.sql
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U tributia -d tributia_buildcore']
      interval: 5s
      timeout: 5s
      retries: 5

  minio:
    image: minio/minio:latest
    container_name: tributia_minio
    restart: unless-stopped
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: tributia
      MINIO_ROOT_PASSWORD: tributia_dev
    ports:
      - '9000:9000'
      - '9001:9001'
    volumes:
      - minio_data:/data

  redis:
    image: redis:7-alpine
    container_name: tributia_redis
    restart: unless-stopped
    ports:
      - '6379:6379'
    volumes:
      - redis_data:/data

volumes:
  postgres_data:
  minio_data:
  redis_data:
